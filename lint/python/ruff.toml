line-length = 100
target-version = "py312"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C90", # mccabe complexity
]
ignore = [
    "E501", # line length handled by formatter
]

[lint.isort]
known-first-party = []

[format]
quote-style = "double"
indent-style = "space"
